<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-mail confirmado — Listei</title>
<style>
  :root { --bg:#f5f5f7; --ink:#15151a; --ink-soft:#55555f; --accent:#4f46e5; --card:#ffffff; --green:#2fbe8f; --red:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink);
    font-family:"Inter",-apple-system,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif; padding:20px; }
  .card { background:var(--card); border-radius:24px; box-shadow:0 14px 32px rgba(21,21,26,.1); padding:40px 32px; max-width:380px; width:100%; text-align:center; }
  .badge { width:64px; height:64px; border-radius:50%; margin:0 auto 20px; display:flex; align-items:center; justify-content:center; }
  .badge.loading { background:linear-gradient(135deg,var(--accent),#7c6cf0); box-shadow:0 10px 22px rgba(79,70,229,.3); }
  .badge.ok { background:linear-gradient(135deg,var(--green),#1fa578); box-shadow:0 10px 22px rgba(47,190,143,.3); }
  .badge.err { background:linear-gradient(135deg,var(--red),#e04848); box-shadow:0 10px 22px rgba(255,107,107,.3); }
  h1 { font-size:1.2rem; margin:0 0 10px; }
  p { font-size:.9rem; color:var(--ink-soft); line-height:1.55; margin:0 0 22px; }
  .btn { display:inline-block; background:var(--accent); color:#fff; text-decoration:none; font-weight:700; font-size:.9rem;
    padding:13px 28px; border-radius:999px; border:none; cursor:pointer; font-family:inherit; }
  .countdown { font-size:.76rem; color:var(--ink-soft); margin-top:14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { animation: spin 1s linear infinite; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="badge loading" id="badge">
      <svg class="spinner" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/></svg>
    </div>
    <h1 id="title">Confirmando seu e-mail...</h1>
    <p id="text">Só um instante.</p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
var SUPABASE_URL = "https://ulnrvsaqvmpfdabmnvqu.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_69KsJb7DjqPJXHbrNabZKg_MPXPn45r";
var badge = document.getElementById("badge");
var title = document.getElementById("title");
var text = document.getElementById("text");
var card = document.getElementById("card");

function showOk() {
  badge.className = "badge ok";
  badge.innerHTML = '<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.8l5 5L20 6.3"/></svg>';
  title.textContent = "E-mail confirmado!";
  text.textContent = "Sua conta foi ativada com sucesso.";
  var btn = document.createElement("a");
  btn.href = "index.html";
  btn.className = "btn";
  btn.textContent = "Ir para o Listei agora";
  card.appendChild(btn);
  var cd = document.createElement("div");
  cd.className = "countdown";
  card.appendChild(cd);
  var s = 4;
  cd.textContent = "Te levando pro Listei em " + s + "s...";
  var t = setInterval(function () {
    s--;
    if (s <= 0) { clearInterval(t); window.location.href = "index.html"; }
    else cd.textContent = "Te levando pro Listei em " + s + "s...";
  }, 1000);
}
function showErr(msg) {
  badge.className = "badge err";
  badge.innerHTML = '<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  title.textContent = "Não deu pra confirmar";
  text.textContent = msg || "O link pode ter expirado ou já ter sido usado. Volte ao Listei, entre com seu e-mail e senha, e peça um novo e-mail de confirmação se precisar.";
  var btn = document.createElement("a");
  btn.href = "index.html";
  btn.className = "btn";
  btn.textContent = "Voltar para o Listei";
  card.appendChild(btn);
}

(function () {
  try {
    if (typeof supabase === "undefined" || !supabase.createClient) {
      showErr("Não foi possível carregar a verificação — verifique sua internet e abra o link de novo.");
      return;
    }
    var hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
    var queryParams = new URLSearchParams(window.location.search);
    var errorDesc = hashParams.get("error_description") || queryParams.get("error_description");
    if (errorDesc) {
      showErr(decodeURIComponent(errorDesc.replace(/\+/g, " ")));
      return;
    }

    var supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true }
    });

    var resolved = false;
    supa.auth.onAuthStateChange(function (event, session) {
      if (resolved) return;
      if (session) { resolved = true; showOk(); }
    });
    setTimeout(function () {
      if (resolved) return;
      supa.auth.getSession().then(function (res) {
        if (resolved) return;
        resolved = true;
        if (res && res.data && res.data.session) showOk();
        else showErr();
      });
    }, 2500);
  } catch (e) {
    showErr();
  }
})();
</script>
</body>
</html>
